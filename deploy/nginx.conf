# /etc/nginx/sites-available/nordpress
#
# Zwei Wege zur App:
#  - Port 443 direkt, mit eigenem Zertifikat (selbstsigniert oder per certbot).
#  - Port 80 nur für CloudFront: Die Distribution schickt einen geheimen Header (X-Origin-Verify).
#    Wer ihn nicht mitbringt, wird auf HTTPS umgeleitet. Den Wert erzeugt server-einrichten.sh in
#    /etc/nginx/nordpress-cloudfront.conf, er steht nicht im Repository.
#    Zusätzlich sollte Port 80 in der Sicherheitsgruppe nur für die CloudFront-Prefix-List offen sein.

map_hash_bucket_size 128;                      # der 64-stellige Schlüssel passt nicht in die Standardgröße 64
include /etc/nginx/nordpress-cloudfront.conf;   # map $http_x_origin_verify $nordpress_von_cloudfront

server {
    listen 80 default_server;
    server_name _;

    if ($nordpress_von_cloudfront = 0) {
        return 301 https://$host$request_uri;
    }

    # CloudFront hängt die IP des Besuchers hinten an X-Forwarded-For an, die API nimmt den letzten Eintrag.
    set $np_xff   $http_x_forwarded_for;
    set $np_proto https;
    include /etc/nginx/snippets/nordpress.conf;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/nordpress.crt;
    ssl_certificate_key /etc/nginx/ssl/nordpress.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    set $np_xff   $proxy_add_x_forwarded_for;
    set $np_proto $scheme;
    include /etc/nginx/snippets/nordpress.conf;
}

# /etc/nginx/sites-available/nordpress
# HTTP leitet auf HTTPS um. Das Zertifikat ist selbstsigniert (Übung, keine Domain).
# Mit Domain: certbot --nginx -d <domain> ersetzt die beiden ssl_certificate-Zeilen.

server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/nordpress.crt;
    ssl_certificate_key /etc/nginx/ssl/nordpress.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /opt/nordpress/web;
    index index.html;
    client_max_body_size 6m;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    # Bilder kommen bei S3 per signiertem Link direkt aus dem Bucket
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://*.amazonaws.com; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location ~ ^/(api/|admin/api/|uploads/|health$) {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Vue-Router: alle anderen Pfade landen bei der SPA
    location / {
        try_files $uri /index.html;
    }
}

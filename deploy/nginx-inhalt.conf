# /etc/nginx/snippets/nordpress.conf
# Gemeinsamer Teil beider server-Blöcke. Erwartet $np_xff und $np_proto.

root /opt/nordpress/web;
index index.html;
client_max_body_size 6m;
server_tokens off;

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
# Bilder kommen bei S3 per signiertem Link direkt aus dem Bucket
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://*.amazonaws.com; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

location ~ ^/(api/|admin/api/|uploads/|health$) {
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $np_xff;
    proxy_set_header X-Forwarded-Proto $np_proto;
    proxy_set_header X-Origin-Verify "";   # den geheimen Header nicht an die App weiterreichen
}

location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

# SEO/GEO: Öffentliche Seiten kommen fertig gerendert aus der API (Titel, Beschreibung, JSON-LD, Inhalt),
# dazu sitemap.xml, robots.txt, llms.txt und feed.xml. Ist die API weg, gibt es wie früher die leere SPA.
location ~ ^/($|blog$|seite/|beitrag/|kategorie/|sitemap\.xml$|robots\.txt$|llms\.txt$|feed\.xml$) {
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $np_xff;
    proxy_set_header X-Forwarded-Proto $np_proto;
    proxy_set_header X-Origin-Verify "";
    error_page 502 503 504 = @spa;
}

location @spa {
    try_files /index.html =502;
}

# Vue-Router: alle anderen Pfade landen bei der SPA
location / {
    try_files $uri /index.html;
}
